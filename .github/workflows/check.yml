name: Check factory and Jira
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  statuses: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # VERCEL=1 selects the Vercel backend but a GitHub runner has no project
      # OIDC identity, and Eve 0.52.5 needs it to prepare sandbox templates. So
      # CI never runs the real agent build or deploys. Do not store a pulled
      # VERCEL_OIDC_TOKEN as a secret to make it pass. Deployment success is
      # verified below by reading the exact head commit's Vercel statuses.
      - name: Verify Nuxt station route layout
        working-directory: apps/factory
        env:
          VERCEL: "1"
          NITRO_PRESET: vercel
        run: |
          pnpm exec nuxt build
          node scripts/verify-station-routes.mjs
      - name: Verify authenticated Vercel deployments for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERIFY_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node apps/factory/scripts/verify-vercel-status.mjs
