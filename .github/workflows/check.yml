name: Check factory and Jira
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify hosted Eve bootstrap assets
        working-directory: apps/factory
        env:
          VERCEL: "1"
        run: |
          pnpm exec nuxt build
          EVE_INTERNAL_BUILD_OUTPUT_DIRECTORY=.eve/packaging-verification/.vercel/output EVE_INTERNAL_HOST_BUILD_OUTPUT_DIRECTORY=.vercel/output pnpm build:agent
